<label class="m-check-row" for="{{ field.id_for_label }}">
  <span class="m-check-row__text">
    <strong>{{ field.label }}</strong>
    {% if help %}<span class="m-help">{{ help }}</span>{% endif %}
  </span>
  <input type="checkbox" class="m-switch-input" name="{{ field.html_name }}" id="{{ field.id_for_label }}" {% if field.value %}checked{% endif %}>
</label>
