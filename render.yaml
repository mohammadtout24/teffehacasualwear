# Demo deployment on Render's free plan.
#
# No database service: Render allows one free PostgreSQL database per account
# and it expires after 30 days, so this uses the SQLite file that build.sh
# creates. Render's free disk is temporary, which means anything added on the
# live site (orders, uploaded photos, new products) is lost whenever the service
# redeploys or restarts; each restart rebuilds the demo products instead.
#
# For real orders, add a database (Render paid, or a free Neon/Supabase one) and
# set DATABASE_URL on the service — settings.py picks it up automatically.
services:
  - type: web
    name: teffaha-casual-wear
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: LOAD_SAMPLE_DATA
        value: "True"
      # One worker: several processes writing to one SQLite file lock each other out.
      - key: WEB_CONCURRENCY
        value: 1
      - key: ORDER_NOTIFICATION_EMAIL
        value: teffehawear@gmail.com
      - key: DEFAULT_FROM_EMAIL
        value: onboarding@resend.dev
      - key: RESEND_API_KEY
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: teffehawear@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
